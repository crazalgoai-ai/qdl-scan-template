<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>扫码展示模板配置 - 渔业溯源系统</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    color-scheme: only light;
    --brand:#2563eb;--brand-hover:#1d4fd8;
    --text:#1f2d3d;--text2:#5a6b80;--text3:#8a97a8;
    --line:#e6ebf2;--line2:#eef2f7;--bg:#f4f7fb;--card:#fff;
  }
  html,body{height:100%;}
  html{overflow:hidden;}
  body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;}
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ===== 顶栏 ===== */
  .topbar{height:50px;flex:0 0 50px;background:linear-gradient(90deg,#17305a 0%,#1e4b96 55%,#2563eb 100%);
    display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#fff;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .logo-mark{width:24px;height:24px;border-radius:5px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;}
  .logo-mark svg{width:14px;height:14px;}
  .app-name{font-size:14.5px;font-weight:600;letter-spacing:.5px;}
  .who{display:flex;align-items:center;gap:5px;font-size:12px;color:#fff;
    background:#d64545;border-radius:13px;padding:3px 11px;margin-right:6px;
    box-shadow:0 0 0 3px rgba(214,69,69,.22);}
  .who svg{width:12px;height:12px;}
  .who b{font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:18px;font-size:12.5px;}
  .topbar-right a{color:rgba(255,255,255,.92);text-decoration:none;display:flex;align-items:center;gap:5px;}
  .topbar-right a:hover{color:#fff;}
  .topbar-right svg{width:13px;height:13px;}
  .collapse-btn{background:none;border:0;cursor:pointer;padding:2px;display:flex;}
  .collapse-btn svg{width:15px;height:15px;fill:rgba(255,255,255,.9);}

  /* ===== 侧边栏 ===== */
  .body{flex:1;display:flex;min-height:0;}
  .sidebar{width:200px;flex:0 0 200px;background:#fff;border-right:1px solid var(--line);
    padding:8px 0;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:8px;height:38px;margin:1px 6px;border-radius:6px;
    padding:0 10px;cursor:pointer;color:var(--text);font-size:13px;user-select:none;}
  .nav-item:hover{background:#f7fafe;}
  .nav-item.on,.nav-item.open{background:#eff6ff;}
  .nav-item.on .label,.nav-item.open .label{color:var(--brand);font-weight:500;}
  .nav-item.on .ico svg,.nav-item.open .ico svg{fill:var(--brand);}
  .nav-item.on .arrow,.nav-item.open .arrow{transform:rotate(180deg);}
  .nav-item .ico{width:14px;height:14px;flex:0 0 14px;display:flex;}
  .nav-item .ico svg{width:14px;height:14px;fill:#6d7c90;}
  .nav-item .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-item .arrow{width:9px;height:9px;display:flex;}
  .nav-item .arrow svg{width:9px;height:9px;fill:#a3aebd;}
  .sub-item{display:flex;align-items:center;height:36px;margin:1px 6px;border-radius:6px;
    padding:0 8px 0 46px;font-size:12.5px;color:var(--text2);cursor:pointer;}
  .sub-item:hover{background:#f5f9ff;color:var(--brand);}
  .sub-item.active{background:#dbeafe;color:var(--brand);font-weight:500;}

  /* ===== 主区 ===== */
  .main{flex:1;min-width:0;overflow-y:auto;padding:16px 20px 24px;}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
  .page-title{font-size:16px;font-weight:600;}
  .page-sub{font-size:12px;color:var(--text3);margin-top:4px;}
  .head-acts{display:flex;gap:8px;}
  .btn{height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:#fff;
    color:var(--text);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;transition:all .15s;white-space:nowrap;}
  .btn:hover{border-color:#c3d3ee;color:var(--brand);}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);color:#fff;}
  .btn svg{width:13px;height:13px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .wrap{max-width:880px;}

  /* ===== TAB ===== */
  .tabs{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;}
  .tabs-main{display:flex;flex-wrap:wrap;gap:0 8px;padding:0 16px;border-bottom:1px solid var(--line2);}
  .tab-m{height:42px;display:flex;align-items:center;padding:0 12px;font-size:13.5px;color:var(--text2);
    cursor:pointer;position:relative;user-select:none;white-space:nowrap;}
  .tab-m:hover{color:var(--brand);}
  .tab-m.on{color:var(--brand);font-weight:600;}
  .tab-m.on::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;
    background:var(--brand);border-radius:1px;}

  /* 空态 */
  .empty-state{background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:64px 0;text-align:center;font-size:12.5px;color:var(--text3);}

  /* ===== 模块 ===== */
  .mod{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;transition:border-color .15s;}
  .mod:last-child{margin-bottom:0;}
  .mod.dragging{opacity:.45;border-style:dashed;border-color:#9dbcf3;}
  .mod-hd{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;cursor:pointer;
    user-select:none;}
  .mod-hd:hover{background:#fafcff;}
  .arr{width:6px;height:6px;border-right:1.4px solid #a3aebd;border-bottom:1.4px solid #a3aebd;
    transform:rotate(-135deg);transition:transform .18s;margin:-3px 2px 0 0;flex:0 0 auto;}
  .mod.collapsed .arr{transform:rotate(45deg);margin-top:0;}
  .arr.ghost{visibility:hidden;}
  .mod-hd.plain{cursor:default;}
  .mod-hd.plain:hover{background:none;}
  .mod.collapsed .mod-bd{display:none;}
  .mod-hd .sum{margin-left:auto;font-size:11.5px;color:var(--text3);}
  .mod.off .mod-hd .sum{color:#b9c4d2;}
  .grip{cursor:grab;color:#b9c4d2;user-select:none;display:flex;flex:0 0 10px;padding:2px 0;}
  .grip svg{width:10px;height:14px;fill:currentColor;}
  .grip:active{cursor:grabbing;}
  .grip.ghost{width:10px;flex:0 0 10px;visibility:hidden;cursor:default;}
  .mod-hd .idx{font-family:monospace;font-size:11.5px;font-weight:700;color:#9db4d4;width:15px;}
  .mod-hd .nm{font-size:13.5px;font-weight:600;}
  .mod-hd .cnt{font-size:11.5px;color:var(--text3);}
  .mod-hd .switch{margin-left:12px;}
  .mod-bd{border-top:1px solid var(--line2);padding:10px 14px 12px;}
  .mod-bd.empty{padding:12px 14px;}
  .empty-txt{font-size:12px;color:var(--text3);}
  .mod.off .mod-bd{opacity:.4;pointer-events:none;}
  .mod.off .mod-hd .nm,.mod.off .mod-hd .idx{color:#a9b4c2;}

  /* 字段勾选框（比滑动开关轻） */
  .cb{width:15px;height:15px;border-radius:3px;border:1px solid #cfd9e6;background:#fff;
    flex:0 0 15px;position:relative;cursor:pointer;transition:all .15s;}
  .cb:hover{border-color:#9dbcf3;}
  .cb.on{background:var(--brand);border-color:var(--brand);}
  .cb.on::after{content:'';position:absolute;left:4.5px;top:1px;width:4px;height:8px;
    border-right:1.7px solid #fff;border-bottom:1.7px solid #fff;transform:rotate(38deg);}

  /* 认证报告：一行一项 */
  .rep-row{display:flex;align-items:center;gap:10px;height:38px;padding:0 2px;}
  .rep-row + .rep-row{border-top:1px solid #f3f6fa;}
  .rep-row .fn{flex:1;min-width:0;font-size:12.5px;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rep-row .filechip{font-size:11.5px;color:var(--text3);background:#f6f8fb;
    border-radius:3px;padding:2px 8px;max-width:300px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;}
  .rep-row .filechip.none{color:#b9c4d2;background:#fafbfd;}
  .rep-row .lnk{font-size:12px;color:var(--brand);cursor:pointer;flex:0 0 auto;margin-left:2px;}
  .rep-row .src{font-style:normal;font-size:11.5px;color:var(--text3);
    background:#f1f4f8;border-radius:3px;padding:2px 8px;}
  .rep-row .lnk:hover{text-decoration:underline;}

  /* 基地概况：分组 */
  .grp + .grp{margin-top:4px;padding-top:8px;border-top:1px dashed #eef2f7;}
  .grp-hd{display:flex;align-items:center;gap:8px;height:26px;font-size:12px;font-weight:600;color:var(--text2);}
  .grp-hd .src2{font-style:normal;font-weight:400;font-size:11px;color:var(--text3);
    background:#f1f4f8;border-radius:3px;padding:1px 6px;}

  /* 养殖过程：可拖动排序的字段列表 */
  .fld-list{padding:2px 0;}
  .fld-row{display:flex;align-items:center;gap:10px;height:32px;padding:0 3px;border-radius:4px;}
  .fld-row:hover{background:#f8fbff;}
  .fld-row.dragging{opacity:.45;background:#eff6ff;outline:1px dashed #9dbcf3;}
  .fgrip{color:#c6d0dc;cursor:grab;flex:0 0 auto;display:flex;padding:2px 0;}
  .fgrip svg{width:10px;height:14px;fill:currentColor;}
  .fgrip:active{cursor:grabbing;}
  .fld-row .fno{font-family:monospace;font-size:11px;font-weight:700;color:#b3c0d0;width:14px;flex:0 0 14px;}
  .fld-row .fn{flex:1;min-width:0;font-size:12.5px;color:var(--text2);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .fld-row .switch{flex:0 0 34px;}

  /* 养殖过程：环节内的配置项（图片/文案），受该环节开关控制 */
  .cfg-row{display:flex;align-items:center;gap:10px;height:34px;padding-left:82px;}
  .cfg-row.off{opacity:.42;pointer-events:none;}
  .cfg-row .cfg-lb{flex:0 0 52px;font-size:12.5px;color:var(--text3);}
  .cfg-row .cfg-ctl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;}
  .cfg-row .input{flex:0 0 300px;height:30px;}
  .cfg-row .filechip{font-size:11.5px;color:var(--text3);background:#f6f8fb;border-radius:3px;
    padding:2px 8px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cfg-row .filechip.none{color:#b9c4d2;background:#fafbfd;}
  .cfg-row .lnk{font-size:12px;color:var(--brand);cursor:pointer;flex:0 0 auto;}
  .cfg-row .lnk:hover{text-decoration:underline;}
  .cfg-thumb{width:72px;height:49.3px;flex:0 0 72px;border-radius:3px;background:#f2f5f9 no-repeat;
    border:1px solid var(--line);}

  /* ===== 图片裁切（上传后框选主体） ===== */
  .cropper{position:fixed;inset:0;background:rgba(16,26,42,.45);display:none;
    align-items:center;justify-content:center;z-index:900;}
  .cropper.on{display:flex;}
  .cropper-box{background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(16,32,56,.28);overflow:hidden;}
  .cropper-hd{height:46px;display:flex;align-items:center;gap:8px;padding:0 16px;
    font-size:14px;font-weight:600;border-bottom:1px solid var(--line2);}
  .cropper-hd .x{margin-left:auto;color:var(--text3);cursor:pointer;font-size:18px;
    line-height:1;font-weight:400;}
  .cropper-hd .x:hover{color:var(--text);}
  .cropper-bd{display:flex;gap:18px;padding:16px;}
  .crop-stage{position:relative;background:#0f172a;border-radius:4px;overflow:hidden;flex:0 0 auto;}
  .crop-stage img{display:block;max-width:400px;max-height:350px;user-select:none;-webkit-user-drag:none;}
  .crop-mask{position:absolute;box-shadow:0 0 0 9999px rgba(9,16,28,.55);cursor:move;
    outline:1px solid rgba(255,255,255,.9);}
  .crop-mask i{position:absolute;width:12px;height:12px;border:2px solid #fff;}
  .crop-mask i.tl{left:-1px;top:-1px;border-right:0;border-bottom:0;}
  .crop-mask i.tr{right:-1px;top:-1px;border-left:0;border-bottom:0;}
  .crop-mask i.bl{left:-1px;bottom:-1px;border-right:0;border-top:0;}
  .crop-mask i.br{right:-1px;bottom:-1px;border-left:0;border-top:0;}
  .crop-mask .rs{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;
    border-right:2px solid #fff;border-bottom:2px solid #fff;cursor:nwse-resize;}
  .crop-side{flex:0 0 auto;}
  .crop-side .lb{font-size:11.5px;color:var(--text3);margin-bottom:6px;}
  .crop-pv{width:216px;height:148px;border-radius:4px;border:1px solid var(--line);
    background:#f2f5f9 no-repeat;}
  .cropper-ft{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 14px;}

  /* 字段 */
  .fld-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));column-gap:24px;}
  .fld{display:flex;align-items:center;gap:8px;height:32px;}
  .fld .fn{font-size:12.5px;color:var(--text2);flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .fld .switch{flex:0 0 34px;}

  /* 正式上市：字段 + 自定义文本 */
  .fb{margin-bottom:12px;}
  .fb:last-child{margin-bottom:0;}
  .fb .fld{height:28px;}
  .fb .input{margin-top:4px;margin-left:23px;width:calc(100% - 23px);}

  /* 认证报告：文件上传 */
  .file-row{display:flex;align-items:center;gap:10px;height:30px;background:#f7f9fc;
    border:1px solid var(--line);border-radius:4px;padding:0 9px;}
  .file-row .fname{flex:1;min-width:0;font-size:12px;color:var(--text2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-row .fname.none{color:var(--text3);}
  .file-row .lnk{font-size:12px;color:var(--brand);cursor:pointer;flex:0 0 auto;}
  .file-row .lnk:hover{text-decoration:underline;}
  .fld .src{font-style:normal;font-size:11px;color:var(--text3);background:#f1f4f8;
    border-radius:3px;padding:1px 6px;margin-left:8px;}

  /* 开关 */
  .switch{width:34px;height:18px;border-radius:9px;background:#d5dde8;position:relative;
    cursor:pointer;transition:background .18s;}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(16,32,56,.22);transition:left .18s;}
  .switch.on{background:var(--brand);}
  .switch.on::after{left:18px;}

  .input,.select{height:30px;border:1px solid var(--line);border-radius:4px;background:#fff;
    padding:0 9px;font-size:12.5px;color:var(--text);font-family:inherit;outline:none;
    transition:border-color .15s;width:100%;}
  .input:focus{border-color:#9dbcf3;box-shadow:0 0 0 2px rgba(37,99,235,.08);}
  .input.dim{background:#f7f9fc;color:#a9b4c2;}
  textarea.input{height:auto;padding:7px 9px;line-height:1.65;resize:vertical;}

  /* toast */
  .toast{position:fixed;left:50%;top:74px;transform:translate(-50%,-14px);background:rgba(31,45,61,.92);
    color:#fff;font-size:12.5px;padding:8px 16px;border-radius:4px;opacity:0;pointer-events:none;
    transition:all .22s;z-index:999;}
  .toast.on{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <path d="M2 12c2.5 0 2.5-4 5-4s2.5 4 5 4 2.5-4 5-4 2.5 4 5 4"/>
          <path d="M2 17c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/>
        </svg>
      </div>
      <span class="app-name">渔业溯源系统</span>
    </div>
    <div class="topbar-right">
      <span class="who"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="5.4" r="2.6"/><path d="M2.8 13.6c.5-2.3 2.6-3.6 5.2-3.6s4.7 1.3 5.2 3.6"/></svg><b>协会端</b></span>
      <a href="javascript:;"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="6.5" width="11" height="7.5" rx="1.4"/><path d="M5.2 6.5V4.8a2.8 2.8 0 015.6 0v1.7"/></svg>修改密码</a>
      <a href="javascript:;"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 2.5H3.5A1.5 1.5 0 002 4v8a1.5 1.5 0 001.5 1.5H6"/><path d="M10.5 11L14 8l-3.5-3M14 8H6"/></svg>退出登录</a>
      <button class="collapse-btn"><svg viewBox="0 0 16 16"><path d="M2 3.5h12v1.5H2zM2 7.25h12v1.5H2zM2 11h12v1.5H2z"/></svg></button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="head-row">
        <div>
          <div class="page-title">扫码展示模板配置</div>
          <div class="page-sub">拖动左侧手柄可调整模块顺序</div>
        </div>
        <div class="head-acts">
          <button class="btn" id="btnReset" onclick="resetAll()">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 8a5 5 0 11-1.6-3.7M13 2.6V5.4h-2.8"/></svg>重置
          </button>
          <button class="btn btn-primary" id="btnSave" onclick="toast('配置已保存')">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3.2 3.2L13 5"/></svg>保存配置
          </button>
        </div>
      </div>

      <div class="wrap">
        <div class="tabs" id="tabs">
          <div class="tabs-main" id="tabsMain"></div>
        </div>
        <div id="mods"></div>
      </div>
    </main>
  </div>
</div>

<div class="cropper" id="cropper">
  <div class="cropper-box">
    <div class="cropper-hd">裁切图片<span class="x" id="cropClose">×</span></div>
    <div class="cropper-bd">
      <div class="crop-stage" id="cropStage">
        <img id="cropImg" alt="">
        <div class="crop-mask" id="cropBox">
          <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
          <span class="rs" id="cropRs"></span>
        </div>
      </div>
      <div class="crop-side">
        <div class="lb">展示效果</div>
        <div class="crop-pv" id="cropPv"></div>
      </div>
    </div>
    <div class="cropper-ft">
      <button class="btn" id="cropCancel">取消</button>
      <button class="btn btn-primary" id="cropOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="picker" accept=".pdf,.jpg,.jpeg,.png" hidden>

<script>
/* ================= 侧边栏 ================= */
const NAV = [
  {k:'master', t:'主数据管理', i:'M2 2.5h12v3H2zM2 6.5h12v3H2zM2 10.5h12v3H2z'},
  {k:'dash',   t:'驾驶舱', i:'M2 12.5V9l3-2.4 3 2.4v3.5zM8.6 12.5V6.4l2.6-2 2.8 2v6.1z'},
  {k:'farm',   t:'养殖过程管理', i:'M8 1.5l1.2 2.1 2.4.4-.3 2.4 1.7 1.8-1.7 1.8.3 2.4-2.4.4L8 14.9l-2.2-1.1-2.4-.4.3-2.4L2 9.2l1.7-1.8-.3-2.4 2.4-.4z'},
  {k:'qc',     t:'质检管理', i:'M8 1.4l5.6 2.3v4c0 3.3-2.3 6-5.6 6.9-3.3-.9-5.6-3.6-5.6-6.9v-4z'},
  {k:'chun',   t:'淳牌有机鱼养殖过程', i:'M2 3.4h5.4v8.8H2zM8.6 3.4H14v8.8H8.6z'},

const CERT_TAG = {'检测报告':'捕捞时上传'};

function tpl(){ return cur.t.indexOf('qf') === 0 ? 'qf' : 'land'; }

function mods(){ return tpl() === 'qf' ? QF_MODULES : LAND_MODULES; }

/* 模块的可配置项：普通模块取 fields，分组模块（基地概况）按「组名·项名」展开 */
function fieldsOf(m){
  if(m.fields) return m.fields;
  if(m.groups){
    let out = [];
    m.groups.forEach(g=>g.items.forEach(it=>out.push(g.name + '·' + it)));
    return out;
  }
  return [];
}

function defaultState(){
  const m = mods(), t = tpl();
  const s = {
    order: m.map(x=>x.id),
    on: {},
    fldOn: {},
    fieldOrder: {},
    text: Object.assign({}, TEXT_BY_TPL[t]),
    file: Object.assign({}, FILE_BY_TPL[t]),
    img: {},
    crop: {}
  };
  m.forEach(x=>{
    s.on[x.id] = true;
    s.fieldOrder[x.id] = fieldsOf(x).slice();
    fieldsOf(x).forEach(f=>{ s.fldOn[x.id+'|'+f] = true; });
  });
  return s;
}

function applyState(s){
  state.order = s.order; state.on = s.on; state.fldOn = s.fldOn;
  state.fieldOrder = s.fieldOrder || {};
  state.text = s.text; state.file = s.file;
  state.img = s.img || {}; state.crop = s.crop || {};
}

/* 缩略图/预览的裁切样式：crop 存的是相对原图的归一化区域 */
function cropCss(k, TW, TH){
  const cr = state.crop[k], url = state.img[k];
  if(!cr || !url) return '';
  return `background-image:url('${url}');background-size:${TW/cr.w}px auto;` +
    `background-position:${-(cr.x/cr.w)*TW}px ${-(cr.y/cr.h)*TH}px;`;
}

/* 按配置顺序取字段（新增/缺失的字段自动补齐） */
function orderedFields(m){
  const ord = state.fieldOrder[m.id];
  if(!ord) return m.fields;
  const valid = ord.filter(f=>m.fields.indexOf(f) > -1);
  m.fields.forEach(f=>{ if(valid.indexOf(f) < 0) valid.push(f); });
  return valid;
}

            return `<div class="rep-row">
              <span class="cb${on}" data-fk="${key}"></span>
              <span class="fn">${it}</span>
            </div>`;
          }).join('') + `</div>`;
      }).join('') + `</div>`;
    } else if(m.id === 'cert'){
      body = `<div class="mod-bd">` + m.fields.map(f=>{
        const key = m.id + '|' + f;
        const on = state.fldOn[key] ? ' on' : '';
        const tag = CERT_TAG[f];
        if(tag){
          return `<div class="rep-row">
            <span class="cb${on}" data-fk="${key}"></span>
            <span class="fn">${f}</span>

        }

          <span class="lnk" data-up="${f}">${fn ? '更换' : '上传'}</span>
        </div>`;
      }).join('') + `</div>`;
    } else if(m.id === 'farm'){
      body = `<div class="mod-bd"><div class="fld-list">` + orderedFields(m).map((f,i)=>{
        const key = m.id + '|' + f;
        const on = state.fldOn[key];

          const thumb = state.img[c.k]
            ? `<span class="cfg-thumb" style="${cropCss(c.k, 72, 49.3)}"></span>` : '';
          return `<div class="cfg-row${off}" data-own="${key}">
            <span class="cfg-lb">${c.n}</span>
            <div class="cfg-ctl">${thumb}
              <span class="filechip${fn ? '' : ' none'}" data-file="${c.k}">${fn ? esc(fn) : '未上传'}</span>
              <span class="lnk" data-up="${c.k}">${fn ? '更换' : '上传'}</span>
            </div>
          </div>`;
        }).join('') : '';
        return `<div class="fld-row" data-fid="${f}">
          <span class="fgrip" draggable="true" title="拖动调整顺序">${GRIP}</span>
          <span class="fno">${String(i+1).padStart(2,'0')}</span>
          <span class="cb${on?' on':''}" data-fk="${key}"></span>
          <span class="fn">${f}</span>

      }).join('') + `</div></div>`;
    } else if(m.editable){
      body = `<div class="mod-bd">` + m.fields.map(f=>{
        const key = m.id + '|' + f;
        const isLong = f !== '客服电话';
        const dim = state.fldOn[key] ? '' : ' dim';
        const ctl = isLong
          ? `<textarea class="input${dim}" rows="${f==='感官指标'?3:2}" data-tk="${f}">${esc(state.text[f])}</textarea>`
          : `<input class="input${dim}" data-tk="${f}" value="${escAttr(state.text[f])}">`;
        return `<div class="fb"><div class="fld">` +
          `<span class="cb${state.fldOn[key]?' on':''}" data-fk="${key}"></span>` +
          `<span class="fn">${f}</span></div>${ctl}</div>`;
      }).join('') + `</div>`;
    } else {
      body = `<div class="mod-bd"><div class="fld-grid">` +
        m.fields.map(f=>fldRow(m.id, f)).join('') + `</div></div>`;

    const shown = flds.filter(f=>state.fldOn[m.id+'|'+f]).length;
    const sum = flds.length ? `展示 ${shown}/${flds.length}` : '';
    const open = !collapsedSet[m.id];
    const fixed = m.id === 'banner';
    const grip = fixed
      ? '<span class="grip ghost" title="固定在顶部，不可调整顺序"></span>'
      : '<span class="grip" draggable="true" title="拖动调整顺序">' + GRIP + '</span>';

    return `<div class="mod${state.on[m.id]?'':' off'}${open?'':' collapsed'}" data-id="${m.id}">
      <div class="mod-hd${fixed?' plain':''}">

      </div>

function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* ================= 交互 ================= */
const box = document.getElementById('mods');

box.addEventListener('click', e=>{
  const up = e.target.closest('.lnk[data-up]');
  if(up){
    pendingField = up.dataset.up;
    picker.value = '';
    picker.click();
    return;
  }
  const fs = e.target.closest('[data-fk]');
  if(fs){
    const k = fs.dataset.fk;
    state.fldOn[k] = !state.fldOn[k];
    fs.classList.toggle('on', state.fldOn[k]);
    const mod = fs.closest('.mod');
    const m = mods().find(x=>x.id === mod.dataset.id);
    if(m){
      const flds = fieldsOf(m);
      const shown = flds.filter(f=>state.fldOn[m.id+'|'+f]).length;
      const sum = mod.querySelector('.sum');
      if(sum) sum.textContent = `展示 ${shown}/${flds.length}`;
    }
    mod.querySelectorAll('.cfg-row[data-own]').forEach(r=>{
      r.classList.toggle('off', !state.fldOn[r.dataset.own]);
    });
    const row = fs.closest('.rep-row, .fld');
    let ctl = row && row.querySelector('.input, textarea');
    if(!ctl && row) ctl = row.parentNode.querySelector('.input, textarea');
    if(ctl) ctl.classList.toggle('dim', !state.fldOn[k]);
    return;
  }
  const ms = e.target.closest('.switch[data-mk]');
  if(ms){
    const id = ms.dataset.mk;
    state.on[id] = !state.on[id];
    ms.classList.toggle('on', state.on[id]);
    ms.closest('.mod').classList.toggle('off', !state.on[id]);
    return;
  }
  const hd = e.target.closest('.mod-hd');
  if(hd && !hd.classList.contains('plain') && !e.target.closest('.grip')){
    const mod = hd.closest('.mod');
    const id = mod.dataset.id;
    collapsedSet[id] = !collapsedSet[id];
    mod.classList.toggle('collapsed', !!collapsedSet[id]);

});

/* ================= 图片裁切：框选主体，固定展示框 ================= */
const CROP_R = 1.46;   // 与消费者端卡片图框实测一致（992×678 / 999×687）
const cropper = document.getElementById('cropper');
const cropStage = document.getElementById('cropStage');
const cropImg = document.getElementById('cropImg');
const cropBoxEl = document.getElementById('cropBox');
const cropPv = document.getElementById('cropPv');
const cs = {dw:0, dh:0, x:0, y:0, w:0, h:0, key:'', name:'', url:''};

function openCropper(url, key, name){
  cs.url = url; cs.key = key; cs.name = name;
  cropper.classList.add('on');
  cropImg.src = url;
}

function drawCrop(){
  cropBoxEl.style.left = cs.x + 'px';
  cropBoxEl.style.top = cs.y + 'px';
  cropBoxEl.style.width = cs.w + 'px';
  cropBoxEl.style.height = cs.h + 'px';
  const TW = cropPv.clientWidth, TH = cropPv.clientHeight;
  const s = TW / cs.w;                        // 展示框 / 裁切框
  cropPv.style.backgroundImage = `url("${cs.url}")`;
  cropPv.style.backgroundSize = (cs.dw * s) + 'px auto';
  cropPv.style.backgroundPosition = `${-cs.x * s}px ${-cs.y * s}px`;
}

cropImg.addEventListener('load', ()=>{
  const dw = cropImg.clientWidth, dh = cropImg.clientHeight;
  cs.dw = dw; cs.dh = dh;
  cropStage.style.width = dw + 'px';
  cropStage.style.height = dh + 'px';
  let h = dh * 0.8, w = h * CROP_R;
  if(w > dw * 0.9){ w = dw * 0.9; h = w / CROP_R; }
  cs.w = w; cs.h = h;
  cs.x = (dw - w) / 2; cs.y = (dh - h) / 2;
  drawCrop();
});

/* 拖动裁切框 */
cropBoxEl.addEventListener('pointerdown', e=>{
  if(e.target.classList.contains('rs')) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, ox = cs.x, oy = cs.y;
  cropBoxEl.setPointerCapture(e.pointerId);
  const mv = ev=>{
    cs.x = Math.max(0, Math.min(cs.dw - cs.w, ox + ev.clientX - sx));
    cs.y = Math.max(0, Math.min(cs.dh - cs.h, oy + ev.clientY - sy));
    drawCrop();
  };
  const up = ()=>{
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', mv);
  document.addEventListener('pointerup', up);
});

/* 拉伸裁切框（保持 4:3） */
document.getElementById('cropRs').addEventListener('pointerdown', e=>{
  e.preventDefault(); e.stopPropagation();
  const el = e.target, sx = e.clientX, ow = cs.w;
  el.setPointerCapture(e.pointerId);
  const mv = ev=>{
    let w = ow + (ev.clientX - sx);
    w = Math.max(120, Math.min(cs.dw - cs.x, w));
    cs.w = w; cs.h = w / CROP_R;
    if(cs.y + cs.h > cs.dh) cs.y = cs.dh - cs.h;
    drawCrop();
  };
  const up = ()=>{
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', mv);
  document.addEventListener('pointerup', up);
});

function closeCropper(){
  cropper.classList.remove('on');
  cropImg.removeAttribute('src');
  pendingField = '';
}
document.getElementById('cropClose').onclick = closeCropper;
document.getElementById('cropCancel').onclick = closeCropper;
document.getElementById('cropOk').onclick = ()=>{
  state.file[cs.key] = cs.name;
  state.img[cs.key] = cs.url;
  state.crop[cs.key] = {x:cs.x/cs.dw, y:cs.y/cs.dh, w:cs.w/cs.dw, h:cs.h/cs.dh};
  cropper.classList.remove('on');
  cropImg.removeAttribute('src');
  const nm = cs.name;
  pendingField = '';
  render();
  toast('已上传 ' + nm);
};

/* 拖动排序：模块整体 / 养殖过程内的环节 */
let dragEl = null, dragFld = null;

box.addEventListener('dragstart', e=>{
  const fg = e.target.closest('.fgrip');
  if(fg){
    dragFld = fg.closest('.fld-row');
    dragFld.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'field');
    try { e.dataTransfer.setDragImage(dragFld, 20, 16); } catch(err){}
    return;
  }
  const grip = e.target.closest('.grip');
  if(!grip) return;
  dragEl = grip.closest('.mod');
  dragEl.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragEl.dataset.id);
  try { e.dataTransfer.setDragImage(dragEl, 20, 22); } catch(err){}
});

box.addEventListener('dragover', e=>{
  if(dragFld){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const list = dragFld.parentNode;
    const after = afterItem(list, e.clientY, dragFld);
    if(after == null) list.appendChild(dragFld);
    else if(after !== dragFld) list.insertBefore(dragFld, after);
    return;
  }
  if(!dragEl) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const after = afterEl(e.clientY);
  if(after == null) box.appendChild(dragEl);
  else if(after !== dragEl){
    const first = box.querySelector('.mod');
    if(first && first.dataset.id === 'banner' && after === first){
      box.insertBefore(dragEl, first.nextSibling);   // 首图固定在顶部，不能插到它前面
    } else {
      box.insertBefore(dragEl, after);
    }
  }
});

box.addEventListener('drop', e=>{ if(dragEl || dragFld) e.preventDefault(); });

box.addEventListener('dragend', ()=>{
  if(dragFld){
    const list = dragFld.parentNode;
    const mod = list.closest('.mod');
    dragFld.classList.remove('dragging');
    dragFld = null;
    state.fieldOrder[mod.dataset.id] = [...list.querySelectorAll('.fld-row')].map(r=>r.dataset.fid);
    list.querySelectorAll('.fld-row').forEach((r,i)=>{
      r.querySelector('.fno').textContent = String(i+1).padStart(2,'0');
    });
    return;
  }
  if(!dragEl) return;
  dragEl.classList.remove('dragging');
  dragEl = null;
  state.order = [...box.querySelectorAll('.mod')].map(el=>el.dataset.id);
  box.querySelectorAll('.mod').forEach((el,i)=>{
    el.querySelector('.idx').textContent = String(i+1).padStart(2,'0');
  });
});

function afterEl(y){
  const els = [...box.querySelectorAll('.mod:not(.dragging)')];
  for(const el of els){
    const r = el.getBoundingClientRect();
    if(y < r.top + r.height/2) return el;
  }
  return null;
}

function afterItem(list, y, moving){
  const els = [...list.querySelectorAll('.fld-row')].filter(el=>el !== moving);
  for(const el of els){
    const r = el.getBoundingClientRect();
    if(y < r.top + r.height/2) return el;
  }
  return null;
}

function resetAll(){
  applyState(defaultState());
  delete stateMap[cur.t];
  render(); toast('已恢复默认配置');
}

/* ================= 通用 ================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 1800);
}

/* TAB 切换（每个页签各存一份配置，初始内容一致） */
const stateMap = {};
function snapshot(){
  const fo = {};
  Object.keys(state.fieldOrder).forEach(k=>{ fo[k] = state.fieldOrder[k].slice(); });
  return {order:[...state.order], on:{...state.on}, fldOn:{...state.fldOn},
    text:{...state.text}, file:{...state.file}, img:{...state.img}, crop:{...state.crop},
    fieldOrder: fo};
}
document.getElementById('tabs').addEventListener('click', e=>{
  const tm = e.target.closest('[data-t]');
  if(!tm || tm.dataset.t === cur.t) return;
  stateMap[cur.t] = snapshot();
  cur.t = tm.dataset.t;
  applyState(stateMap[cur.t] || defaultState());
  renderViews();
});

renderViews();
</script>
</body>
